{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center flex-grow-1 py-4 py-sm-5 animate-in delay-1" style="min-height: 75vh;">
    <div class="glass-panel p-4 p-sm-5 position-relative overflow-hidden" style="width: 100%; max-width: 440px; border-radius: 24px;">
        <!-- Glowing Orb Background -->
        <div class="position-absolute top-0 start-50 translate-middle w-100 h-100 opacity-50" style="background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 70%); pointer-events: none; z-index: 0;"></div>
        
        <div class="text-center mb-4 position-relative z-1">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3 border border-success border-opacity-25" style="width: 60px; height: 60px;">
                <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h2 class="fw-bold text-white mb-1">Create Account</h2>
            <p class="text-secondary small">Join MarketMind's financial intelligence platform</p>
        </div>

        <form method="POST" class="no-loader position-relative z-1" id="signupForm">
            <div class="mb-3">
                <label class="text-secondary small fw-medium mb-2 ms-1">Username</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0 px-3"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-2 py-2 fs-6 shadow-none" placeholder="TraderJoe" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="text-secondary small fw-medium mb-2 ms-1">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0 px-3"><i class="bi bi-envelope text-secondary"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-2 py-2 fs-6 shadow-none" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label class="text-secondary small fw-medium mb-2 ms-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0 px-3"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-2 py-2 fs-6 shadow-none" placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-3 rounded-4 fw-bold fs-6 shadow-lg mb-2">
                <span id="btnText">Create Account <i class="bi bi-check2-circle ms-1 fs-5 align-middle"></i></span>
                <span id="btnSpinner" class="d-none"><span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Creating Account...</span>
            </button>
        </form>

        <div class="text-center mt-4 position-relative z-1">
            <small class="text-secondary">Already a member? <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold text-decoration-none border-bottom border-primary border-opacity-50 pb-1">Sign in here</a></small>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signupForm')?.addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        const text = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');
        if (btn && text && spinner) {
            btn.disabled = true;
            text.classList.add('d-none');
            spinner.classList.remove('d-none');
        }
    });
</script>
{% endblock %}
